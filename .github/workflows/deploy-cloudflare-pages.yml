name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'web/**'
      - 'scripts/**'
      - 'package.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

concurrency:
  group: deploy-liftbig
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build patched dist
        run: npm run build:web
        env:
          DIST_VERSION: ${{ github.sha }}

      - name: Verify library Max/Avg patches
        run: |
          grep -q 'maxSet' dist/assets/libraryExerciseTracking-CAhSe-yn.js
          grep -q 'formatTileMax' dist/assets/LibraryBrowser-BlmrAKrd.js
          test "$(wc -c < dist/assets/LibraryBrowser-BlmrAKrd.js)" -gt 15000

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy via Wrangler
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=liftbig --commit-dirty=true

      - name: Trigger Cloudflare rebuild
        if: env.CF_API_TOKEN == '' && env.CF_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$CF_DEPLOY_HOOK"

      - name: Deployment not configured
        if: env.CF_API_TOKEN == '' && env.CF_DEPLOY_HOOK == ''
        run: |
          echo "::warning::Cloudflare deploy secrets are missing."
          echo "Add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID in repo Settings → Secrets."
          echo "Or connect this repo in Cloudflare Pages with output directory: dist"
          exit 1
