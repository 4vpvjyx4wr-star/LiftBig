name: Deploy LiftBig to Cloudflare

# Canonical production deploy: every push to main on codycon1/LiftBig builds and
# deploys the Vue app. Requires GitHub Actions secrets on codycon1/LiftBig:
#   CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# and/or CLOUDFLARE_DEPLOY_HOOK.
#
# Cloudflare Git integration (optional backup): connect Pages/Workers to
# github.com/codycon1/LiftBig with root directory `LiftBig`, build `npm run build`,
# output `dist`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-liftbig-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LiftBig
    permissions:
      contents: read
      deployments: write
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: LiftBig/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Deploy with Wrangler
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: LiftBig
          command: deploy --commit-dirty=true

      - name: Trigger Cloudflare deploy hook
        if: ${{ env.CF_API_TOKEN == '' && env.CF_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$CF_DEPLOY_HOOK"

      - name: Missing Cloudflare secrets
        if: ${{ env.CF_API_TOKEN == '' && env.CF_DEPLOY_HOOK == '' }}
        run: |
          echo "::error::Cloudflare deploy secrets are missing on codycon1/LiftBig."
          echo "Add in GitHub → Settings → Secrets and variables → Actions:"
          echo "  • CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID  (preferred)"
          echo "  • or CLOUDFLARE_DEPLOY_HOOK"
          echo "Also point Cloudflare at github.com/codycon1/LiftBig (root: LiftBig)."
          exit 1
